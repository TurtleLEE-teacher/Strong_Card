name: Cron

# Vercel Hobby 플랜의 크론은 하루 1회로 제한된다. 15분 간격 동기화가
# 불가능하므로 GitHub Actions가 앱의 크론 엔드포인트를 호출한다.
#
# 필요한 저장소 시크릿:
#   APP_BASE_URL  배포된 앱 주소 (예: https://strong-card.vercel.app)
#                 끝 슬래시나 http:// 를 넣어도 아래에서 정규화한다.
#   CRON_SECRET   앱 환경변수와 같은 값

on:
  schedule:
    # 거래 동기화: 15분마다
    - cron: '*/15 * * * *'
    # 월 단위 알림: 매일 KST 09:00 (= UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 실행할 작업
        type: choice
        options: [sync, alerts]
        default: sync

jobs:
  sync:
    # 15분 스케줄과 수동 실행(sync)에서만 돈다
    if: github.event.schedule == '*/15 * * * *' || inputs.job == 'sync'
    runs-on: ubuntu-latest
    steps:
      - name: 거래 동기화 및 혜택 알림
        env:
          BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: sync
        run: |
          # 스크립트 본문은 두 job이 동일하다. ENDPOINT만 다르다.
          # 시크릿은 env로 넘긴다 — 스크립트에 직접 보간하면 값에 든
          # 따옴표가 셸을 깨뜨린다.
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_BASE_URL 또는 CRON_SECRET이 없어 $ENDPOINT 를 건너뜁니다. 저장소 Settings > Secrets에 등록하세요."
            exit 0
          fi

          # 308 리다이렉트의 두 원인을 제거한다.
          #   1) 끝 슬래시 → '//api/cron/...' 이 되어 Next.js가 308로 정규화한다
          #   2) http:// → Vercel이 https로 308 리다이렉트한다
          base="$BASE_URL"
          while [ "${base%/}" != "$base" ]; do base="${base%/}"; done
          base="https://${base#*://}"

          # -L: 그래도 리다이렉트가 남으면 따라간다. 308은 메서드(POST)를
          # 유지하므로 안전하다. --proto-redir로 https 밖으로는 안 나간다.
          out=$(curl -sS -L --proto-redir '=https' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -o /tmp/cron-body.txt \
            -w '%{http_code} %{num_redirects}' \
            "$base/api/cron/$ENDPOINT")
          code=${out%% *}
          redirects=${out##* }
          cat /tmp/cron-body.txt

          # 실패를 조용히 넘기면 알림이 안 오는데 이유를 모르게 된다.
          if [ "$code" != "200" ]; then
            echo "::error::$ENDPOINT 실패 (HTTP $code, 리다이렉트 $redirects회, 경로 /api/cron/$ENDPOINT)"
            exit 1
          fi
          if [ "$redirects" != "0" ]; then
            echo "::warning::리다이렉트 $redirects회를 거쳤습니다. APP_BASE_URL이 최종 주소인지 확인하세요."
          fi

  alerts:
    if: github.event.schedule == '0 0 * * *' || inputs.job == 'alerts'
    runs-on: ubuntu-latest
    steps:
      - name: 실적·한도 알림 평가
        env:
          BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: alerts
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_BASE_URL 또는 CRON_SECRET이 없어 $ENDPOINT 를 건너뜁니다. 저장소 Settings > Secrets에 등록하세요."
            exit 0
          fi

          base="$BASE_URL"
          while [ "${base%/}" != "$base" ]; do base="${base%/}"; done
          base="https://${base#*://}"

          out=$(curl -sS -L --proto-redir '=https' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -o /tmp/cron-body.txt \
            -w '%{http_code} %{num_redirects}' \
            "$base/api/cron/$ENDPOINT")
          code=${out%% *}
          redirects=${out##* }
          cat /tmp/cron-body.txt

          if [ "$code" != "200" ]; then
            echo "::error::$ENDPOINT 실패 (HTTP $code, 리다이렉트 $redirects회, 경로 /api/cron/$ENDPOINT)"
            exit 1
          fi
          if [ "$redirects" != "0" ]; then
            echo "::warning::리다이렉트 $redirects회를 거쳤습니다. APP_BASE_URL이 최종 주소인지 확인하세요."
          fi
