name: Deploy

# B안 — GitHub Actions에서 Vercel로 배포한다.
#
# Vercel의 GitHub 연동(A안)을 쓴다면 이 워크플로는 필요 없다.
# 시크릿이 없으면 조용히 건너뛰므로 켜 둬도 방해되지 않는다.
#
# 필요한 저장소 시크릿:
#   VERCEL_TOKEN       https://vercel.com/account/tokens
#   VERCEL_ORG_ID      `vercel link` 후 .vercel/project.json
#   VERCEL_PROJECT_ID  위와 동일

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 시크릿 확인
        id: guard
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::notice::VERCEL_TOKEN이 없어 배포를 건너뜁니다 (Vercel GitHub 연동을 쓰는 중이면 정상)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Vercel CLI 설치
        if: steps.guard.outputs.ready == 'true'
        run: npm i -g vercel@latest

      - name: 환경 정보 가져오기
        if: steps.guard.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 빌드
        if: steps.guard.outputs.ready == 'true'
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 배포
        if: steps.guard.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "배포 완료: $url"
          echo "### 배포 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
