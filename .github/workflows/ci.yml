name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint src --max-warnings=0

      - name: Typecheck
        run: npx tsc --noEmit

      # 실적·혜택 계산이 이 앱의 전부다. 여기가 깨지면 화면의 모든 숫자가 틀린다.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
